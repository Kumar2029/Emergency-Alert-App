<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Elite | Emergency Response System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #ff3e3e;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 62, 62, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 62, 62, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .logo span { color: var(--accent-red); }

        .tagline {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-red);
            background: rgba(255,255,255,0.08);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--accent-red);
            color: white;
            box-shadow: 0 10px 20px -5px rgba(255, 62, 62, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(255, 62, 62, 0.5);
        }

        .status {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 600;
            height: 20px;
        }

        .loading-pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glass-panel">
            <div class="logo">GUARDIAN<span>ELITE</span></div>
            <div class="tagline">TACTICAL RESPONSE INTERFACE</div>

            <div id="authView">
                <div class="input-group">
                    <label>Terminal Email</label>
                    <input type="email" id="email" placeholder="operator@guardian.elite">
                </div>
                <div class="input-group">
                    <label>Security Key</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="login()">Enter Terminal</button>
            </div>

            <div id="status" class="status"></div>
            <div class="footer-note">ENCRYPTED END-TO-END • VERSION 2.4.0</div>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');

            if (!email || !password) {
                status.style.color = "#ff3e3e";
                status.innerText = "❌ Credentials Required";
                return;
            }

            status.innerHTML = '<span class="loading-pulse"></span> Authenticating...';
            
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    status.style.color = "#4ade80";
                    status.innerText = "✅ Access Granted. Redirecting...";
                    localStorage.setItem('sos_token', data.token);
                    // Redirect to a placeholder or the tracking dashboard if you have a user ID
                    // For now, let's just show success. 
                    // In a real flow, you'd go to /track/ID
                } else {
                    status.style.color = "#ff3e3e";
                    status.innerText = "❌ Access Denied";
                }
            } catch (e) {
                status.innerText = "❌ Connection Failed";
            }
        }
    </script>
</body>
</html>
