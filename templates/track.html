<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Elite | SOS Command Center</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Guardian Custom CSS -->
    <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>

    <!-- Map Layer -->
    <div id="map"></div>

    <!-- Radar Sweep Effect -->
    <div class="radar-overlay">
        <div class="radar-sweep"></div>
    </div>

    <!-- UI Overlay -->
    <div class="dashboard-overlay">
        
        <!-- Header -->
        <header class="header fade-in" style="animation-delay: 0.1s;">
            <div class="logo-section">
                <div style="font-size: 24px; font-weight: 800; letter-spacing: -1px;">GUARDIAN<span style="color: var(--accent-red)">ELITE</span></div>
                <div id="categoryBadge" style="font-size: 12px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">GENERAL</div>
            </div>
            
            <div class="sos-indicator">
                <span class="status-pulse"></span>
                ACTIVE SOS SIGNAL
            </div>
        </header>

        <!-- Left Sidebar: Victim Profile -->
        <aside class="sidebar-left">
            <div class="glass-panel victim-card fade-in" style="animation-delay: 0.2s;">
                <div class="avatar-large" id="avatar">?</div>
                <div>
                    <h2 id="userName" style="font-size: 24px; font-weight: 800;">Tracking...</h2>
                    <p style="color: var(--text-secondary); font-size: 12px; margin-top: 4px;">ID: #SOS-{{ user_id }}</p>
                </div>
                
                <div style="width: 100%; height: 1px; background: var(--glass-border); margin: 8px 0;"></div>
                
                <div class="location-info">
                    <div class="info-label">Current Coordinates</div>
                    <div class="info-value" id="coords">0.0000, 0.0000</div>
                </div>
                
                <div class="location-info" style="margin-top: 16px;">
                    <div class="info-label">Signal Status</div>
                    <div class="info-value" style="color: #4ade80;">ENCRYPTED • STRONG</div>
                </div>

                <div class="location-info" style="margin-top: 16px;">
                    <div class="info-label">Device Battery</div>
                    <div class="info-value" id="battery">--%</div>
                </div>
            </div>

            <div class="glass-panel fade-in" style="animation-delay: 0.3s; padding: 20px;">
                <button onclick="window.location.reload()" style="width: 100%; background: var(--accent-red); border: none; color: white; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: transform 0.2s;">
                    REFRESH COMMAND LINK
                </button>
            </div>
        </aside>

        <!-- Center: Empty for map visibility -->
        <main class="sidebar-center"></main>

        <!-- Right Sidebar: Evidence & Logs -->
        <aside class="sidebar-right">
            <!-- Audio Evidence Card -->
            <div class="glass-panel audio-card fade-in" style="animation-delay: 0.4s;">
                <div class="info-label">Audio Evidence (Latest)</div>
                <div class="waveform-container" id="waveform">
                    <!-- Bars generated via JS -->
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                    <div style="font-size: 12px; color: var(--text-secondary);">15s Capture</div>
                    <button id="playAudio" style="background: white; border: none; padding: 6px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;">
                        PLAY CLIP
                    </button>
                </div>
            </div>

            <!-- Activity Logs -->
            <div class="glass-panel log-container fade-in" style="animation-delay: 0.5s;">
                <div class="info-label" style="margin-bottom: 12px;">Operational Log</div>
                <div id="logPanel">
                    <div class="log-item"><span class="log-time">SYS</span> Command center initialized</div>
                    <div class="log-item"><span class="log-time">GPS</span> Awaiting satellite lock...</div>
                </div>
            </div>
        </aside>

    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const userId = {{ user_id }};
        let map = L.map('map', { zoomControl: false, attributionControl: false }).setView([0, 0], 2);
        let marker;
        let amenityMarkers = L.layerGroup().addTo(map);
        let path = L.polyline([], { 
            color: '#ff3e3e', 
            weight: 4, 
            opacity: 0.6,
            dashArray: '8, 8'
        }).addTo(map);

        // Dark-mode Tile Layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        function addLog(msg, type = "GPS") {
            const panel = document.getElementById('logPanel');
            const entry = document.createElement('div');
            entry.className = 'log-item';
            entry.innerHTML = `<span class="log-time">${type}</span> ${msg}`;
            panel.prepend(entry);
        }

        // Generate Mock Waveform
        const waveform = document.getElementById('waveform');
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            bar.style.animationDelay = `${i * 0.1}s`;
            waveform.appendChild(bar);
        }

        async function fetchNearbyServices(lat, lng) {
            const query = `
                [out:json];
                (
                  node["amenity"="hospital"](around:5000, ${lat}, ${lng});
                  node["amenity"="police"](around:5000, ${lat}, ${lng});
                  node["amenity"="fire_station"](around:5000, ${lat}, ${lng});
                );
                out body;
            `;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                amenityMarkers.clearLayers();
                
                data.elements.forEach(el => {
                    const iconType = el.tags.amenity === 'police' ? '🚓' : (el.tags.amenity === 'hospital' ? '🏥' : '🔥');
                    const color = el.tags.amenity === 'police' ? '#3b82f6' : '#ef4444';
                    
                    const icon = L.divIcon({
                        className: 'amenity-marker',
                        html: `<div style="background: ${color}; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-size: 14px;">${iconType}</div>`,
                        iconSize: [30, 30]
                    });
                    
                    L.marker([el.lat, el.lon], { icon: icon })
                        .bindPopup(`<b>${el.tags.name || 'Emergency Service'}</b><br>${el.tags.amenity.toUpperCase()}`)
                        .addTo(amenityMarkers);
                });
                addLog(`Found ${data.elements.length} nearby emergency units.`, "SYS");
            } catch (e) { console.error("Overpass error", e); }
        }

        let latestAudioUrl = null;
        const audioPlayer = new Audio();

        let trackingInterval = setInterval(updateTracking, 3000);
        let isSafe = false;

        function updateTracking() {
            if (isSafe) return;
            if (map) map.invalidateSize();
            fetch(`/get_location/${userId}`)
                .then(res => res.json())
                .then(data => {
                    const sosIndicator = document.querySelector('.sos-indicator');
                    if (data.is_active === false) {
                        isSafe = true;
                        clearInterval(trackingInterval);
                        sosIndicator.innerHTML = '<span style="color: #4ade80;">🟢 TARGET SECURED / SAFE</span>';
                        sosIndicator.style.background = 'rgba(74, 222, 128, 0.1)';
                        sosIndicator.style.border = '1px solid #4ade80';
                        addLog("User verified safe. Monitoring suspended.", "SYS");
                        return;
                    }

                    if (data.location) {
                        const coords = data.location.split('q=')[1].split(',');
                        const lat = parseFloat(coords[0]);
                        const lng = parseFloat(coords[1]);
                        const pos = [lat, lng];
                        
                        // ... rest of update logic ...
                        document.getElementById('coords').innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                        document.getElementById('userName').innerText = data.full_name;
                        document.getElementById('avatar').innerText = data.full_name[0];
                        document.getElementById('battery').innerText = data.battery ? `${data.battery}%` : 'Unknown';
                        
                        const catBadge = document.getElementById('categoryBadge');
                        catBadge.innerText = data.category.toUpperCase();
                        if (data.category === 'Medical') catBadge.style.color = '#4ade80';
                        else if (data.category === 'Security') catBadge.style.color = '#3b82f6';
                        else if (data.category === 'Fire') catBadge.style.color = '#f97316';
                        else catBadge.style.color = 'var(--text-secondary)';
                        latestAudioUrl = data.latest_audio;
                        
                        const playBtn = document.getElementById('playAudio');
                        if (latestAudioUrl) {
                            playBtn.style.opacity = "1";
                            playBtn.innerText = "PLAY CLIP";
                        } else {
                            playBtn.style.opacity = "0.5";
                            playBtn.innerText = "NO AUDIO";
                        }
                        
                        if (data.battery && parseInt(data.battery) < 20) {
                            document.getElementById('battery').style.color = 'var(--accent-red)';
                        } else {
                            document.getElementById('battery').style.color = '#4ade80';
                        }

                        if (!marker) {
                            const icon = L.divIcon({ className: 'pulse-marker-elite', iconSize: [24, 24] });
                            marker = L.marker(pos, { icon: icon }).addTo(map);
                            map.setView(pos, 17);
                            addLog("Target signal locked. Tracking engaged.", "SYS");
                            fetchNearbyServices(lat, lng);
                        } else {
                            marker.setLatLng(pos);
                            map.panTo(pos);
                            const lastPos = path.getLatLngs().slice(-1)[0];
                            if (!lastPos || Math.abs(lastPos.lat - lat) > 0.0001 || Math.abs(lastPos.lng - lng) > 0.0001) {
                                path.addLatLng(pos);
                                addLog(`Movement detected: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                                fetchNearbyServices(lat, lng);
                            }
                        }
                    }
                })
                .catch(err => console.log("Polling..."));
        }

        document.getElementById('playAudio').addEventListener('click', () => {
            if (latestAudioUrl) {
                audioPlayer.src = latestAudioUrl;
                audioPlayer.play();
                addLog("Playing audio evidence...", "SYS");
            }
        });

        updateTracking();
    </script>
</body>
</html>
