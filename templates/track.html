<!DOCTYPE html>
<html>
<head>
    <title>SOS COMMAND CENTER</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --danger: #ff3333; --bg: #0a0a0b; --card: #16161a; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: white; overflow: hidden; }
        
        #map { height: 100vh; width: 100vw; position: absolute; top: 0; z-index: 1; filter: grayscale(0.5) contrast(1.2) invert(0.9) hue-rotate(180deg); }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        .glass { background: rgba(22, 22, 26, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; pointer-events: all; padding: 20px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; display: inline-block; margin-right: 10px; box-shadow: 0 0 10px var(--danger); animation: blink 1s infinite; }
        
        .log-panel { width: 300px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #aaa; }
        .log-entry { margin-bottom: 5px; border-left: 2px solid var(--danger); padding-left: 10px; }
        
        .user-card { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 50px; height: 50px; background: linear-gradient(45deg, var(--danger), #ff8c00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        /* Custom Marker Pulse */
        .pulse-marker { width: 20px; height: 20px; background: var(--danger); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 20px var(--danger); }
        .pulse-marker::after { content: ''; position: absolute; top: -10px; left: -10px; width: 40px; height: 40px; border: 2px solid var(--danger); border-radius: 50%; animation: ring 2s ease-out infinite; }
        @keyframes ring { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

<div id="map"></div>

<div class="overlay">
    <div class="top-bar glass">
        <div class="user-card">
            <div class="user-avatar" id="avatar">?</div>
            <div>
                <div style="font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px;">Target Individual</div>
                <div style="font-size: 18px; font-weight: bold;" id="userName">Tracking...</div>
            </div>
        </div>
        <div>
            <span class="status-dot"></span>
            <span style="font-weight: bold; letter-spacing: 2px;">LIVE SOS</span>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div class="glass log-panel" id="logPanel">
            <div class="log-entry">System initialized...</div>
            <div class="log-entry">Awaiting GPS lock...</div>
        </div>
        
        <div class="glass" style="text-align: right;">
            <div style="font-size: 10px; color: #888;">COORDINATES</div>
            <div id="coords" style="font-family: monospace; font-size: 14px;">0.0000, 0.0000</div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const userId = {{ user_id }};
    let map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
    let marker;
    let path = L.polyline([], { color: '#ff3333', weight: 3, dashArray: '10, 10', opacity: 0.5 }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    function addLog(msg) {
        const panel = document.getElementById('logPanel');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        panel.prepend(entry);
    }

    function updateTracking() {
        fetch(`/get_location/${userId}`)
            .then(res => res.json())
            .then(data => {
                if (data.location) {
                    const coords = data.location.split('q=')[1].split(',');
                    const lat = parseFloat(coords[0]);
                    const lng = parseFloat(coords[1]);
                    const pos = [lat, lng];

                    document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    document.getElementById('userName').innerText = data.full_name;
                    document.getElementById('avatar').innerText = data.full_name[0];

                    if (!marker) {
                        const icon = L.divIcon({ className: 'pulse-marker', iconSize: [20, 20] });
                        marker = L.marker(pos, { icon: icon }).addTo(map);
                        map.setView(pos, 17);
                        addLog("Target located. Signal strong.");
                    } else {
                        // Smooth move (simple version for demo)
                        marker.setLatLng(pos);
                        map.panTo(pos);
                        if (path.getLatLngs().length === 0 || path.getLatLngs().slice(-1)[0].lat !== lat) {
                            path.addLatLng(pos);
                            addLog("Location updated. Movement detected.");
                        }
                    }
                }
            })
            .catch(err => addLog("Lost signal. Retrying..."));
    }

    setInterval(updateTracking, 5000); // 5 second polling for "more dynamic" feel
    updateTracking();
</script>

</body>
</html>
